<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  svg { display: block; }
</style>
</head>
<body>
<!--
  沿用 0.3.6 及之前的图标构图：浅色圆角底 + 包子 + 蓝色对话气泡 + 带下载箭头的文档，改成矢量重绘。
  ?size=128&pad=16  商店 / manifest 128 图标：按 Chrome 规范留 16px 透明边，主体 96x96
  ?size=48&pad=2    小尺寸图标：基本铺满；<=32 时简化为包子 + 下载角标，保证能看清
-->
<script>
  const params = new URLSearchParams(location.search);
  const size = Number(params.get("size") || 128);
  const pad = Number(params.get("pad") || 16);
  const simple = size <= 32;
  const s = (size - pad * 2) / 96;

  const defs = `
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f8"/>
    </linearGradient>
    <radialGradient id="bun" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".65" stop-color="#f8e9cf"/>
      <stop offset="1" stop-color="#ebd2a8"/>
    </radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#1c64f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1c3a6b" flood-opacity=".16"/>
    </filter>`;

  // 包子：圆润的身体 + 顶部褶子 + 表情。cx/cy 为身体中心，k 为缩放
  function bun(cx, cy, k, face = true) {
    return `<g transform="translate(${cx} ${cy}) scale(${k})" filter="url(#shadow)">
      <path d="M0-25c4 0 6.5 3 8 5.5C19-18 26-9 26 2c0 13-11.5 21-26 21S-26 15-26 2c0-11 7-20 18-22.5C-6.5-22-4-25 0-25z" fill="url(#bun)"/>
      <path d="M-7-19.5c3 2.5 4.5 5 5 8M7-19.5c-3 2.5-4.5 5-5 8M0-24v9" fill="none" stroke="#e4c99d" stroke-width="1.5" stroke-linecap="round"/>
      ${face ? `
      <path d="M-14-2.5q4-3 7.5-.5M7-3q3.5-2.5 7.5.5" fill="none" stroke="#3a2a1c" stroke-width="1.6" stroke-linecap="round"/>
      <ellipse cx="-10" cy="4" rx="3.2" ry="3.8" fill="#2b2118"/>
      <ellipse cx="10.5" cy="4" rx="3.2" ry="3.8" fill="#2b2118"/>
      <circle cx="-9" cy="2.6" r="1.1" fill="#fff"/>
      <circle cx="11.5" cy="2.6" r="1.1" fill="#fff"/>
      <ellipse cx="-17" cy="10" rx="4" ry="2.4" fill="#f7a3a3" opacity=".55"/>
      <ellipse cx="17.5" cy="10" rx="4" ry="2.4" fill="#f7a3a3" opacity=".55"/>
      <path d="M-4.5 9.5q4.8 1.2 9.6 0-.6 6-4.8 6t-4.8-6z" fill="#c2412d"/>
      <path d="M-2.5 13.3q2.6-1.6 5 0-1 1.4-2.5 1.4t-2.5-1.4z" fill="#f08a7a"/>` : `
      <ellipse cx="-9" cy="4" rx="3.6" ry="4.2" fill="#2b2118"/>
      <ellipse cx="9" cy="4" rx="3.6" ry="4.2" fill="#2b2118"/>
      <path d="M-5 11q5 4 10 0" fill="none" stroke="#c2412d" stroke-width="3" stroke-linecap="round"/>`}
    </g>`;
  }

  const full = `
    <path d="M52 16h28a9 9 0 0 1 9 9v12a9 9 0 0 1-9 9h-3l1 7-8-7H52a9 9 0 0 1-9-9V25a9 9 0 0 1 9-9z" fill="url(#blue)" filter="url(#shadow)"/>
    <circle cx="56" cy="31" r="2.7" fill="#fff"/><circle cx="66" cy="31" r="2.7" fill="#fff"/><circle cx="76" cy="31" r="2.7" fill="#fff"/>
    ${bun(35, 59, 1.12)}
    <g filter="url(#shadow)">
      <path d="M60 46h15l9 9v25a4 4 0 0 1-4 4H60a4 4 0 0 1-4-4V50a4 4 0 0 1 4-4z" fill="#fff"/>
      <path d="M75 46v6a3 3 0 0 0 3 3h6z" fill="#dbe4f0"/>
      <path d="M61 54h9M61 59h16M61 64h12" stroke="#c9d3e0" stroke-width="2" stroke-linecap="round"/>
      <path d="M70 66v11M65 72.5l5 5 5-5" fill="none" stroke="#1c64f2" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>`;

  const small = `
    ${bun(40, 50, 1.3, false)}
    <circle cx="72" cy="72" r="20" fill="url(#blue)" stroke="#fff" stroke-width="4"/>
    <path d="M72 61v19M64 72.5l8 8 8-8" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>`;

  document.body.innerHTML = `
  <svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <defs>${defs}</defs>
    <g transform="translate(${pad} ${pad}) scale(${s})">
      <rect x=".75" y=".75" width="94.5" height="94.5" rx="22" fill="url(#bg)" stroke="#e1e7ef" stroke-width="1.2"/>
      ${simple ? small : full}
    </g>
  </svg>`;
</script>
</body>
</html>
